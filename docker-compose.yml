services:
  libvirt:
    build: .
    privileged: true
    security_opt:
      - apparmor=unconfined
    ports:
      - "${SSH_PORT:-2222}:22"
    volumes:
      - libvirt_conf:/etc/libvirt
      - libvirt_data:/var/lib/libvirt
      - ssh_conf:/etc/ssh
    environment:
      - LIBVIRT_USER_PASSWORD
      - SSH_AUTHORIZED_KEYS

volumes:
  libvirt_conf:
  libvirt_data:
  ssh_conf:
